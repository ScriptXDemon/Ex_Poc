format: pdf
partial: true          # only sampled products are labelled; other products' values are not judged
# Poongsan copper-alloy strip catalogue (113 pages): one 3-page section per alloy (composition, physical and per-temper
# mechanical tables). Units sit in their own table column (MPa, Hv, %IACS, W/(m·K), ℃, wt%), so `v` is the cell value
# only; the temper of mechanical values is in the param name. Only values unique to that alloy within its window are
# used (neighbouring sections repeat many numbers). Ownership tests: C2600 (B1, p24), P425 (p90), P19005 (p99) and P70
# (p111) have no title heading in the parse, only "UNS No. ..." and the name in the Features text, so their values
# must not drift to the previous alloy; NS2/NS3 share identical Features/Applications text and differ only in tables.
# Names avoid the prefix pairs P26/P26HYPER, P1000HS/P1000HS2/P1000HS3, P90/P90HYPER, P194/P194HSL.
