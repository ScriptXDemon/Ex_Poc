# Future Forces Forum 2022 exhibition catalogue (132 pages): mostly exhibitor company profiles with very few explicit
# specs. Pages 5-30 hold only forewords and the programme, so the start sample comes from the first exhibitor pages
# (p46-49, pos 0.14-0.18). Middle sample: p68-72 (pos 0.47-0.54). Pages 105-132 hold conference programmes and ads with
# no spec-bearing product; the end sample is the only two products presented there (p100 GORE-TEX ad, p106 Aruba ESP (dropped: an IT platform, not a defence product),
# Czech text), text facts only. Ownership tests: Arbit Data Diode vs Arbit RUGGED C4ISTAR Gateway (same paragraph,
# different accreditation levels); FOTAS vs OPTTA-PP62X (same paragraph, 100 km belongs to FOTAS); company facts of each
# exhibitor are negatives. "Arbit Data Diode" also covers "Arbit Data Diode CORE": the document states the values for both.
