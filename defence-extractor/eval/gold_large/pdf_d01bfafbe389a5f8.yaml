# Northrop Grumman Propulsion Products Catalog (144 pages): one data sheet per motor (dotted "label....value" lists)
# plus summary tables (large motors Table 1 / Table 2 on p8-11, one row per motor; STAR summary p67-68). Page windows
# set by the requester: start p3-30, middle p60-85, end p115-144. Start = Orion 32XL (own sheet p15) and the adjacent
# table rows Orion 50S XLT / Orion 50S XLG (p8, p10; XLT also has its own sheet p23). Middle = Orion LAS ACM (p62) and
# the adjacent sheets STAR 12GV / STAR 13B (p80-81). End = STAR 92 (p117) and the adjacent sheets ASAS 21-85V /
# ASAS 21-120 (p124-125). No sampled name contains another (ORION 50S XL, ORION 32, STAR 13, ASAS 21-120V not
# sampled; note ASAS 21-120 is a substring of the unsampled ASAS 21-120V, a description-only page). Left out: values
# shared by two motors of a window (diameter 32.5 / 50.2, propellant 33,145, burn time 69.0, mass fractions 0.90 /
# 0.92 / 0.93 in Table 1, ignition delay 0.02 / 0.012, TP-H-3062, titanium case, graphite-epoxy case, FLIGHT-PROVEN,
# DEVELOPMENT, ACM mass fraction 0.37 = STAR 5F), dash-ranged temperatures, and STAR 92 values that are repeated in
# the middle-window STAR summary table (total impulse, Isp, propellant weight, mass fraction).
