# Lapua 2026 catalogue (19 pages, 1,514 blocks): cartridge cards (calibre > bullet weight & type > product no., with
# muzzle velocity in m/s and fps, ballistic coefficients G1/G7, GEE / PBR sight-in distances) laid out as separate
# label and number blocks, then dense ballistic and component tables (pages 14-18). Sample: cartridge cards at the
# start (p4) and middle (p6-7). The end tables are not labelled: the parser merges their columns ("100 yd 2525 786"),
# so a reliable key cannot be written from them. Aliases always carry the bullet weight or product number so a
# calibre-only record (".308 Winchester") is not mistaken for a specific cartridge.
products:
  P1: {name: ".222 Remington 3.6 g / 55 gr FMJ", aliases: ["4315021", ".222 Remington 55 gr FMJ", ".222 Remington FMJ 55 gr", ".222 Rem. FMJ 3,6 g / 55 gr"], pos: start, page: 4}
  P2: {name: ".243 Winchester 5.8 g / 90 gr FMJ", aliases: ["4316052", ".243 Winchester 90 gr FMJ", ".243 Winchester FMJ 90 gr", ".243 Win. FMJ 5,8 g / 90 gr"], pos: start, page: 4}
