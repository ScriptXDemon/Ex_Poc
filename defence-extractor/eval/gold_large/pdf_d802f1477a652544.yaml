  P4: {name: ".308 Winchester 11.0 g / 170 gr Lock Base", aliases: ["4317596", ".308 Winchester 170 gr Lock Base", ".308 Winchester Lock Base 170 gr", ".308 Win. Lock Base 11,0 g / 170 gr"], pos: middle, page: 6}
