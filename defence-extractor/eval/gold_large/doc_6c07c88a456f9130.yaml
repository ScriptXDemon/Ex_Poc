# Defense Industry Daily P-8 Poseidon article (1002 blocks, mostly dated contract news). Windows: start 0.00-0.20 =
# platform/weapons/sensors/competitors sections (b75-b136); middle 0.40-0.60 = FY2013-14 news (Challenger MSA,
# DOT&E reliability, P-8i Mk.82 drop); end 0.80-1.00 = FY2005-09 news + sources (engine cert, MX-20HD pick, HAAWC note).
# Linkage cases: MX-20HD turret, PW150A engine (Lockheed Orion21 bid), Mk.82 bomb, CFM56-7B27A/3 engine and HAAWC kit
# own their own values, not the P-8A. Skipped: "30,000 feet" (b946 = both HAAWC launch altitude and P-8A surveillance
# altitude), JSTARS-recap requirements (b439, no product owner), Orion21 / NP2000 propeller. T-1 first-flight
# altitude (b800) and contract values / fleet counts are negatives. nums omitted on pure model designations
# (AN/APY-10, MX-20HD, CFM56-7B27A/3...) so their digits do not numerically match unrelated values.
