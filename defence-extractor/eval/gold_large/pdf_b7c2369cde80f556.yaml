# L3Harris Tactical Communications 2024-2025 worldwide product catalogue (Interlink CS copy, 294 pages, 574 tables):
# radio / accessory sections with "Label: value" spec tables, some multi-model tables. Page windows set by the
# requester: start p5-50, middle p130-170, end p250-294. Start = three adjacent radios with near-identical spec-table
# layouts (AN/PRC-167 p16-17, KIV-335A p35-36, AN/PRC-165 p37-38; immersion / weight / power differ per model).
# Middle = RF-7850A-MR and RF-7850A-UA (one column each of the shared RF-7850A spec table, p149) and RF-7800W-AT202
# (one column of the 7-antenna RF-7800W table, p163, headers written "RF-7800W- AT202 2-FOOT"). End = Secure Field
# Programmer (p255), Locust RF-7980-ST001 (p262), RF-5057-AN004 (row of the p264 charger table + own section p267).
# Left out: values shared by two products of a window (0.5 ppm, 6 dB NF, MIL-STD-810G, Black, Green, ~6 hours, RS-232,
# USB 2.0, 30 dB), RF-7850A rows filled only in the MR column (probably merged cells), antenna rows given only under
# AT201 (merged cells), the RF-7800W VSWR row (one column missing, alignment not certain), and products repeated
# elsewhere in the catalogue (HF power-amplifier table p53 = p132, RF-410D-PA050, RF-5902-CH208).
