  - {p: P8, param: tid_bit_active_time_increase, alt: [bit_active_time, tid_bit_active_time, alarm_delay], v: "adding 4 seconds to the TID BIT Active time", nums: [4], any: ["4 seconds"], b: b1455}
  - {p: P8, k: text, v: "eliminates sending a false wideband photo sensor channel 1 alarm continuous Thermal Monitoring (CTM) message", any: ["false wideband photo sensor channel 1 alarm"], b: b1455}
