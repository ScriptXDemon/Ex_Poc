  - {id: hover_ceiling_oge, name: Hover Ceiling OGE, family: performance, dimension: length, classes: [helicopter, uav], status: candidate,
     aliases: [hoge, hover ceiling oge, hover out of ground effect, hover ceiling out of ground effect], description: "Hover ceiling out of ground effect."}
  - {id: hover_ceiling_ige, name: Hover Ceiling IGE, family: performance, dimension: length, classes: [helicopter, uav], status: candidate,
     aliases: [hige, hover ceiling ige, hover in ground effect], description: "Hover ceiling in ground effect."}
  - {id: operating_depth, name: Operating Depth, family: performance, dimension: length, classes: [submarine, uuv, torpedo, sonar], legacy: [operating_depth_m],
     aliases: [operating depth, diving depth, max depth, depth rating, test depth], description: "Operating / maximum diving depth."}
  - {id: max_range, name: Maximum Range (weapon), family: performance, dimension: length, classes: [artillery, mortar, missile, rocket, launcher, gun_cannon, air_defence_system, torpedo, loitering_munition, ammunition], legacy: [maximum_range_km],
     aliases: [max range, maximum range, firing range, strike range, max. range, range (weapon), maximum firing range], anti: [platform driving range], description: "Maximum reach of a weapon / munition."}
  - {id: effective_range, name: Effective Range, family: performance, dimension: length, classes: [small_arm, sniper_rifle, machine_gun, grenade_launcher, gun_cannon, ammunition, electronic_warfare], legacy: [effective_range_km, effective_range_m],
     aliases: [effective range, effective firing range, max effective range], description: "Effective range of a weapon."}
  - {id: detection_range, name: Detection Range, family: sensor, dimension: length, classes: [radar, eo_ir, sonar, acoustic_sensor, air_defence_system], legacy: [detection_range_km],
