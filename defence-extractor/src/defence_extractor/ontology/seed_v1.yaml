  - {id: rate_of_fire, name: Rate of Fire, family: armament, dimension: rate, classes: [artillery, mortar, gun_cannon, machine_gun, small_arm, launcher, turret_rws, air_defence_system], legacy: [rate_of_fire_rpm],
