# Defence product ontology — seed v1.0.0
# Canonical parameters come from the v0 prompt's parameter list (cleaned: unit-free ids, duplicates merged,
# legacy ids kept as aliases). "candidate" parameters are common specs missing from v0: they are mapped
# consistently but need approval to become canonical. Anything else found on a page is kept as "dynamic".
version: "1.0.0"

families: [identity, physical, mass, mobility, propulsion, armament, ammunition, protection, sensor, fire_control,
           guidance_navigation, communication_c2, payload, performance, operating_environment, automation_autonomy,
           compatibility, mission_target, survivability, maintainability_support, other_technical]

taxonomy:
  land: [armoured_vehicle, tank, apc_ifv, mrap, light_tactical_vehicle, logistics_truck, ugv, artillery, air_defence_system, engineering_vehicle]
  air: [combat_aircraft, trainer_aircraft, transport_aircraft, special_mission_aircraft, helicopter, uav, loitering_munition, aerostat]
  naval: [surface_combatant, patrol_vessel, auxiliary_vessel, submarine, usv, uuv, naval_gun_system]
  weapon: [small_arm, sniper_rifle, machine_gun, grenade_launcher, gun_cannon, mortar, missile, rocket, launcher, turret_rws, ammunition, torpedo, mine, bomb_guidance_kit, directed_energy]
  sensor: [radar, eo_ir, sonar, laser_rangefinder, night_vision, acoustic_sensor]
  electronics: [electronic_warfare, communication_c2, antenna, navigation, computing_rugged, power_system, battery]
  protection: [armour_protection_kit, active_protection_system, cbrn, signature_management, personal_protection]
  space: [satellite, launch_vehicle, ground_segment]
  other: [simulation_training, support_equipment, component_subsystem, other]

# core parameters the known-spec hunter (A5A) looks for, per category (any domain)
core_parameters:
  armoured_vehicle: [crew, troop_capacity, combat_weight, length_overall, width, height, max_road_speed, operational_range, engine_power, protection_level, main_armament, payload_capacity]
  tank: [crew, combat_weight, length_overall, width, height, max_road_speed, operational_range, engine_power, main_armament, secondary_armament, protection_level]
  apc_ifv: [crew, troop_capacity, combat_weight, length_overall, width, height, max_road_speed, operational_range, engine_power, protection_level, main_armament]
  mrap: [crew, troop_capacity, combat_weight, max_road_speed, operational_range, engine_power, protection_level]
  light_tactical_vehicle: [crew, payload_capacity, combat_weight, max_road_speed, operational_range, engine_power, length_overall, width, height]
  logistics_truck: [payload_capacity, combat_weight, max_road_speed, operational_range, engine_power, drive_configuration]
  ugv: [weight, payload_capacity, max_speed, endurance, operational_range, propulsion_type, sensor_suite]
  artillery: [calibre, barrel_length_calibres, max_range, rate_of_fire, crew, combat_weight, elevation_range, traverse_range, deployment_time, ammunition_type]
  mortar: [calibre, max_range, rate_of_fire, crew, weight, elevation_range, traverse_range, deployment_time]
  air_defence_system: [max_range, engagement_altitude, max_tracked_targets, rate_of_fire, deployment_time, guidance_type, launch_platform]
  combat_aircraft: [max_takeoff_weight, max_speed, service_ceiling, combat_radius, operational_range, length_overall, wingspan, engine_power, hardpoints, crew]
  trainer_aircraft: [max_takeoff_weight, max_speed, service_ceiling, operational_range, endurance, wingspan, length_overall, crew]
  transport_aircraft: [max_takeoff_weight, payload_capacity, max_speed, cruise_speed, operational_range, service_ceiling, troop_capacity, crew]
  special_mission_aircraft: [max_takeoff_weight, endurance, operational_range, service_ceiling, sensor_suite, crew]
  helicopter: [max_takeoff_weight, max_speed, cruise_speed, operational_range, endurance, service_ceiling, hover_ceiling_oge, hover_ceiling_ige, rotor_diameter, length_overall, crew, troop_capacity, engine_power]
  uav: [max_takeoff_weight, payload_capacity, endurance, operational_range, max_speed, service_ceiling, wingspan, sensor_suite, launch_platform]
  loitering_munition: [weight, warhead_weight, endurance, operational_range, max_speed, warhead_type, launch_platform, sensor_suite, target_type]
  surface_combatant: [length_overall, beam, draft, displacement, max_speed, operational_range, crew_complement, propulsion_type, main_armament]
  patrol_vessel: [length_overall, beam, draft, displacement, max_speed, operational_range, crew_complement, propulsion_type, main_armament]
  submarine: [length_overall, beam, displacement, operating_depth, max_speed, endurance, crew_complement, propulsion_type]
  usv: [length_overall, beam, weight, max_speed, endurance, operational_range, payload_capacity, propulsion_type]
  uuv: [length_overall, diameter, weight, max_speed, endurance, operating_depth, sensor_suite, propulsion_type]
  small_arm: [calibre, action_type, barrel_length, length_overall, weight, magazine_capacity, rate_of_fire, effective_range, muzzle_velocity]
  sniper_rifle: [calibre, action_type, barrel_length, length_overall, weight, magazine_capacity, effective_range, twist_rate]
  machine_gun: [calibre, rate_of_fire, weight, length_overall, barrel_length, effective_range, muzzle_velocity]
  grenade_launcher: [calibre, weight, length_overall, effective_range, rate_of_fire]
  gun_cannon: [calibre, rate_of_fire, muzzle_velocity, effective_range, weight, ammunition_type, barrel_length]
  missile: [max_range, weight, length_overall, diameter, guidance_type, seeker_type, warhead_type, warhead_weight, propulsion_type, max_speed, launch_platform, target_type]
  rocket: [calibre, max_range, weight, length_overall, warhead_type, guidance_type, launch_platform]
  launcher: [ammunition_type, max_range, rate_of_fire, deployment_time, crew, launch_platform, magazine_capacity]
  turret_rws: [calibre, main_armament, secondary_armament, elevation_range, traverse_range, weight, protection_level, magazine_capacity]
  ammunition: [calibre, projectile_weight, muzzle_velocity, ammunition_type, effective_range, penetration, fuze_type, warhead_type]
  torpedo: [weight, length_overall, diameter, max_range, max_speed, operating_depth, guidance_type, warhead_weight, propulsion_type]
  radar: [frequency_band, detection_range, max_tracked_targets, power_output, antenna_type, weight]
  eo_ir: [detection_range, sensor_suite, weight, power_output]
  sonar: [frequency_band, detection_range, operating_depth, weight]
  electronic_warfare: [frequency_band, power_output, effective_range, weight]
  communication_c2: [frequency_band, power_output, operational_range, weight]
  antenna: [frequency_band, weight]
  satellite: [weight, orbit_type, power_output, payload_type]

relation_predicates:
  manufactures: "company -> product it makes"
  variant_of: "variant -> base product"
  part_of: "subsystem/component -> system it belongs to"
  mounted_on: "weapon/turret/sensor -> platform it is mounted on"
  carries: "platform -> payload/system it carries"
  fires: "launcher/gun -> munition it fires"
  uses: "system -> item it uses (ammunition, fuel, ...)"
  integrated_with: "system -> system it is integrated with"
  launched_from: "munition/uav -> launch platform"
  compatible_with: "system -> compatible system/platform"
  targets: "weapon -> target class"
  replaces: "new product -> legacy product"
  compares_with: "product -> compared product"
  powered_by: "platform -> engine/powerplant"
  equipped_with: "platform -> weapon/sensor/subsystem"
  transportable_by: "system -> carrier (aircraft, truck, ship)"
  incorporates_technology: "product -> technology it uses"
  supplied_to: "product -> customer/user"

parameters:
  # ---------------- identity / general ----------------
  - {id: action_type, name: Action Type, family: identity, type: text, classes: [small_arm, sniper_rifle, machine_gun], legacy: [action_type],
     aliases: [action, operating system, operation, mechanism], description: "Operating mechanism of a firearm (gas-operated, bolt action, short recoil...)."}
  - {id: product_type, name: Product Type, family: identity, type: text, classes: ["*"], status: candidate,
     aliases: [type, vehicle type, system type, class], description: "Generic class designation stated for the product (e.g. 'self-propelled howitzer')."}
  # ---------------- physical / dimensions ----------------
  - {id: length_overall, name: Length Overall, family: physical, dimension: length, classes: ["*"], legacy: [length_overall_m],
     aliases: [length, overall length, total length, length overall, hull length, l, length with gun, length (overall)],
     anti: [wheelbase, barrel length, width, height, beam], description: "Overall length of the system (not wheelbase, barrel, width or height)."}
  - {id: width, name: Width, family: physical, dimension: length, classes: ["*"], status: candidate,
     aliases: [width, overall width, total width, breadth, w], anti: [beam (naval)], description: "Overall width."}
  - {id: height, name: Height, family: physical, dimension: length, classes: ["*"], status: candidate,
     aliases: [height, overall height, total height, h, height to hull roof], description: "Overall height."}
  - {id: ground_clearance, name: Ground Clearance, family: mobility, dimension: length, classes: [armoured_vehicle, tank, apc_ifv, mrap, light_tactical_vehicle, logistics_truck, ugv], status: candidate,
     aliases: [ground clearance, clearance], description: "Distance between ground and lowest point of the vehicle."}
  - {id: wheelbase, name: Wheelbase, family: physical, dimension: length, classes: [armoured_vehicle, apc_ifv, mrap, light_tactical_vehicle, logistics_truck], status: candidate,
     aliases: [wheelbase, wheel base], description: "Distance between front and rear axles."}
  - {id: diameter, name: Diameter, family: physical, dimension: length, classes: [missile, rocket, torpedo, uuv, ammunition], status: candidate,
     aliases: [diameter, dia, body diameter, calibre (missile body)], description: "Body diameter of a missile, torpedo, UUV or projectile."}
  - {id: barrel_length, name: Barrel Length, family: armament, dimension: length, classes: [small_arm, sniper_rifle, machine_gun, gun_cannon, artillery], legacy: [barrel_length_mm],
     aliases: [barrel length, barrel, barrel length (physical)], anti: [L52, calibre ratio], description: "Physical barrel length (mm / inches)."}
  - {id: barrel_length_calibres, name: Barrel Length (calibres), family: armament, type: text, classes: [artillery, gun_cannon, tank], legacy: [barrel_length_cal],
     aliases: [barrel length (calibres), calibre length, l/52, barrel length in calibres], description: "Barrel length as a ratio in calibres, e.g. 'L52', '155mm/39 cal'."}
  - {id: beam, name: Beam, family: physical, dimension: length, classes: [surface_combatant, patrol_vessel, auxiliary_vessel, submarine, usv], legacy: [beam_m],
     aliases: [beam, breadth (vessel), width (vessel)], description: "Width of a vessel."}
  - {id: draft, name: Draft, family: physical, dimension: length, classes: [surface_combatant, patrol_vessel, auxiliary_vessel, submarine, usv], legacy: [draft_m],
     aliases: [draft, draught], description: "Vessel draught."}
  - {id: wingspan, name: Wingspan, family: physical, dimension: length, classes: [combat_aircraft, trainer_aircraft, transport_aircraft, special_mission_aircraft, uav, loitering_munition, missile], legacy: [wing_span_m],
     aliases: [wing span, wingspan, span], description: "Wing span."}
  - {id: rotor_diameter, name: Rotor Diameter, family: physical, dimension: length, classes: [helicopter, uav], status: candidate,
     aliases: [rotor diameter, main rotor diameter], description: "Main rotor diameter."}
  # ---------------- mass ----------------
  - {id: weight, name: Weight, family: mass, dimension: mass, classes: ["*"], legacy: [weight_kg, missile_weight_kg, gun_weight_t],
     aliases: [weight, mass, total weight, missile weight, launch weight, gun weight, system weight, weight (empty magazine)], description: "Weight of the item (for vehicles prefer combat_weight / empty_weight)."}
  - {id: combat_weight, name: Combat / Gross Weight, family: mass, dimension: mass, classes: [armoured_vehicle, tank, apc_ifv, mrap, light_tactical_vehicle, logistics_truck, artillery], legacy: [vehicle_weight_t],
     aliases: [combat weight, gross vehicle weight, gvw, gvwr, max weight, all-up weight, combat loaded weight, gross weight, max. gvw, vehicle weight], description: "Combat / gross vehicle weight."}
  - {id: empty_weight, name: Empty Weight, family: mass, dimension: mass, classes: ["*"], legacy: [empty_weight_kg],
     aliases: [empty weight, curb weight, kerb weight, dry weight, unladen weight, tare weight], description: "Kerb / empty weight without payload."}
  - {id: max_takeoff_weight, name: Max Take-Off Weight, family: mass, dimension: mass, classes: [combat_aircraft, trainer_aircraft, transport_aircraft, special_mission_aircraft, helicopter, uav], legacy: [mtow_kg],
     aliases: [mtow, maximum take-off weight, max take off weight, max. take-off weight, maximum takeoff weight, mtom], description: "Maximum take-off weight."}
  - {id: payload_capacity, name: Payload Capacity, family: payload, dimension: mass, classes: ["*"], legacy: [payload_capacity_kg],
     aliases: [payload, payload capacity, load capacity, max payload, useful load, carrying capacity], description: "Payload / load the platform can carry."}
  - {id: projectile_weight, name: Projectile Weight, family: ammunition, dimension: mass, classes: [ammunition, artillery, gun_cannon, small_arm], legacy: [projectile_weight_kg, shell_weight_kg],
     aliases: [projectile weight, bullet weight, shell weight, projectile mass, round weight, cartridge weight], description: "Weight of the projectile / shell / bullet."}
  - {id: warhead_weight, name: Warhead Weight, family: armament, dimension: mass, classes: [missile, rocket, loitering_munition, torpedo], legacy: [warhead_weight_kg],
     aliases: [warhead weight, warhead mass, warhead], description: "Weight of the warhead."}
  - {id: displacement, name: Displacement, family: mass, dimension: mass, classes: [surface_combatant, patrol_vessel, auxiliary_vessel, submarine], legacy: [displacement_t],
     aliases: [displacement, full load displacement, standard displacement], description: "Vessel displacement."}
  # ---------------- mobility / performance ----------------
  - {id: max_speed, name: Maximum Speed, family: performance, dimension: speed, classes: ["*"], legacy: [maximum_speed_kmh, max_speed_knots],
     aliases: [max speed, maximum speed, top speed, speed, max. speed, vmax, dash speed, sprint speed], description: "Maximum speed (any medium; use conditions for water/road/sea state)."}
  - {id: max_road_speed, name: Maximum Road Speed, family: mobility, dimension: speed, classes: [armoured_vehicle, tank, apc_ifv, mrap, light_tactical_vehicle, logistics_truck, artillery, ugv], legacy: [max_speed_kmh],
     aliases: [max road speed, maximum road speed, road speed, speed on road], description: "Maximum road speed of a land vehicle."}
  - {id: cruise_speed, name: Cruise Speed, family: performance, dimension: speed, classes: [combat_aircraft, trainer_aircraft, transport_aircraft, special_mission_aircraft, helicopter, uav, loitering_munition, surface_combatant, patrol_vessel], status: candidate,
     aliases: [cruise speed, cruising speed, max cruise speed, economical speed, loiter speed], description: "Cruise / loiter speed."}
  - {id: operational_range, name: Operational Range, family: performance, dimension: length, classes: ["*"], legacy: [operational_range_km, range_nm],
     aliases: [range, operational range, cruising range, road range, ferry range, max range (platform), driving range, autonomy (distance), radius of action], anti: [weapon firing range], description: "Distance the PLATFORM can travel / operate (not weapon reach)."}
  - {id: combat_radius, name: Combat Radius, family: performance, dimension: length, classes: [combat_aircraft, uav, loitering_munition], legacy: [combat_radius_km],
     aliases: [combat radius, mission radius, radius], description: "Combat radius."}
  - {id: endurance, name: Endurance, family: performance, dimension: time, classes: ["*"], legacy: [endurance_h],
     aliases: [endurance, flight endurance, loiter time, flight time, mission endurance, autonomy (time), operating time, battery life], description: "Time the system can operate."}
  - {id: service_ceiling, name: Service Ceiling, family: performance, dimension: length, classes: [combat_aircraft, trainer_aircraft, transport_aircraft, special_mission_aircraft, helicopter, uav, loitering_munition], legacy: [service_ceiling_m],
