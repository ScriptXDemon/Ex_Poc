[project]
name = "defence-extractor"
version = "1.1.0"
description = "Multi-agent, evidence-backed defence product intelligence extraction from HTML and PDF documents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=8.5",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "lxml>=5.2",
  "lxml_html_clean>=0.1",
  "langdetect>=1.0.9",
  "pint>=0.24",
  "rapidfuzz>=3.9",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "temporalio>=1.7",
]

[project.optional-dependencies]
# heavy ML pieces: installed on the server only (torch CPU is installed first from the PyTorch CPU index)
ml = [
  "FlagEmbedding>=1.2.10",
  "docling>=2.5",
  "pypdfium2>=4.30",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
dx = "defence_extractor.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defence_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
